name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Hook Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AXONFLOW_TELEMETRY: "off"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl python3

      - name: Shell syntax check
        run: |
          bash -n scripts/pre-tool-check.sh
          bash -n scripts/post-tool-audit.sh
          bash -n scripts/upgrade-prompt.sh
          bash -n scripts/user-identity.sh
          bash -n scripts/user-token.sh
          bash -n scripts/mcp-auth-headers.sh
          bash -n scripts/telemetry-ping.sh

      - name: Run hook regression tests (mock server)
        run: |
          chmod +x tests/test-hooks.sh scripts/*.sh
          ./tests/test-hooks.sh

      - name: Run upgrade-prompt envelope-handler unit tests
        run: |
          chmod +x tests/test-upgrade-prompt.sh
          ./tests/test-upgrade-prompt.sh

      - name: Run skill-content assertion (axonflow-status prefers local)
        run: |
          chmod +x tests/test-skill-status-prefers-local.sh
          ./tests/test-skill-status-prefers-local.sh

      - name: Run status-output terminology assertion (client_id label)
        run: |
          chmod +x tests/test-status-client-id-label.sh
          ./tests/test-status-client-id-label.sh

      - name: Run .mcp.json headersHelper unit test (auth-header regression)
        run: |
          chmod +x tests/test-mcp-headers.sh
          ./tests/test-mcp-headers.sh

      - name: Run per-developer identity unit test (X-User-Email, #2754)
        run: |
          chmod +x tests/test-user-identity.sh
          ./tests/test-user-identity.sh

      - name: Run X-User-Email hook-wire test (#2754)
        run: |
          chmod +x tests/test-user-email-header-wire.sh
          ./tests/test-user-email-header-wire.sh

      - name: Run per-user token resolver unit test (X-User-Token, #2935)
        run: |
          chmod +x tests/test-user-token.sh
          ./tests/test-user-token.sh

      - name: Run X-User-Token hook-wire test (#2935)
        run: |
          chmod +x tests/test-user-token-header-wire.sh
          ./tests/test-user-token-header-wire.sh

      # #3619. Two steps on purpose: the matrix asserts the behaviour, the gate
      # asserts the matrix can actually go red. A green matrix alone would not
      # distinguish "the field works" from "nothing is being read off the wire".
      - name: "Run license_tier heartbeat matrix (round-trip + fail-open, #3619)"
        run: |
          chmod +x tests/telemetry-license-tier/run.sh tests/telemetry-license-tier/health_server.py
          ./tests/telemetry-license-tier/run.sh

      - name: "Run license_tier mutation gate (the matrix must be able to fail, #3619)"
        run: |
          chmod +x tests/telemetry-license-tier/mutation_gate.sh
          ./tests/telemetry-license-tier/mutation_gate.sh

      - name: Validate plugin structure
        run: |
          # Required files must exist
          test -f .claude-plugin/plugin.json || (echo "Missing plugin.json" && exit 1)
          test -f .mcp.json || (echo "Missing .mcp.json" && exit 1)
          test -f hooks/hooks.json || (echo "Missing hooks.json" && exit 1)
          test -f scripts/pre-tool-check.sh || (echo "Missing pre-tool-check.sh" && exit 1)
          test -f scripts/post-tool-audit.sh || (echo "Missing post-tool-audit.sh" && exit 1)

          # plugin.json must be valid JSON
          jq . .claude-plugin/plugin.json > /dev/null || (echo "Invalid plugin.json" && exit 1)
          jq . .mcp.json > /dev/null || (echo "Invalid .mcp.json" && exit 1)
          jq . hooks/hooks.json > /dev/null || (echo "Invalid hooks.json" && exit 1)

          # Scripts must be executable
          test -x scripts/pre-tool-check.sh || (echo "pre-tool-check.sh not executable" && exit 1)
          test -x scripts/post-tool-audit.sh || (echo "post-tool-audit.sh not executable" && exit 1)

          echo "✅ Plugin structure valid"
